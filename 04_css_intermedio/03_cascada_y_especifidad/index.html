<body>
    <div>
        <h1 class="titulo" id="titulo-principal" style="color: #0f0;">TITULO PRINCIPAL</h1>
        <h2 class="titulo">Esto es un h2 con la clase titulo</h2>

    <h4 id="titulo-principal">El id marca el color de este h4</h4>
