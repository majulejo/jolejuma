<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Fit y Object Position - Centrado</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .image-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            width: 100%;
        }
        
        h4 {
            margin: 15px 0;
            text-align: center;
        }
        
        .wolfcontain {
            width: 400px;
            height: 400px;
            border: 2px solid #000;
            object-fit: contain;
        }

        .wolfcover {
            width: 400px;
            height: 400px;
            border: 2px solid #000;
            object-fit: cover;
        }

        .wolffill {
            width: 400px;
            height: 400px;
            border: 2px solid #000;
            object-fit: fill;
        }
        
        .wolffillscaledown {
            width: 200px;
            height: 300px;
            border: 2px solid #000;
            object-fit: scale-down;
        }
        
        .wolffillnone {
            width: 400px;
            height: 400px;
            border: 2px solid #000;
            object-fit: none;
        }
        
        .none {
            width: 400px;
            height: 400px;
            border: 2px solid #000;
            object-fit: none;
        }

        .wolfposition40 {
            width: 400px;
            height: 200px;
            border: 2px solid #000;
            object-fit: cover;
            object-position: 110px 40px;
        }
        
        .wolfpositionbottom {
            width: 400px;
            height: 100px;
            border: 2px solid #000;
            object-fit: cover;
            object-position: bottom;
        }
        
        .wolfpositioncenter {
            width: 400px;
            height: 100px;
            border: 2px solid #000;
            object-fit: cover;
            object-position: center;
        }
        
        .wolfpositiontop {
            width: 400px;
            height: 100px;
            border: 2px solid #000;
            object-fit: cover;
            object-position: top;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <h4>object-fit: contain;</h4>
        <img class="wolfcontain" src="https://img.freepik.com/foto-gratis/lobo-colorido-fondo-negro_1340-40203.jpg" alt="lobo">
    </div>
    
    <div class="image-container">
        <h4>object-fit: cover</h4>
        <img class="wolfcover" src="https://img.freepik.com/foto-gratis/lobo-colorido-fondo-negro_1340-40203.jpg" alt="lobo">
    </div>

    <div class="image-container">
        <h4>object-fit: fill</h4>
        <img class="wolffill" src="https://img.freepik.com/foto-gratis/lobo-colorido-fondo-negro_1340-40203.jpg" alt="lobo">
    </div>

    <div class="image-container">
        <h4>object-fit: scale-down</h4>
        <img class="wolffillscaledown" src="https://plus.unsplash.com/premium_photo-1673728218157-b316914d636c?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8d29sZiUyMGV5ZXN8ZW58MHx8MHx8fDA%3D" alt="lobo">
    </div>

    <div class="image-container">
        <h4>object-fit: none</h4>
        <img class="wolffillnone" src="https://static.vecteezy.com/system/resources/thumbnails/027/004/685/small/portrait-of-a-wolf-in-the-forest-a-grey-wolf-staring-close-up-portrait-ai-generated-free-photo.jpg" alt="lobo">
    </div>

    <div class="image-container">
        <h4>object-fit: none;</h4>
        <img class="none" src="https://static.vecteezy.com/system/resources/thumbnails/027/004/685/small/portrait-of-a-wolf-in-the-forest-a-grey-wolf-staring-close-up-portrait-ai-generated-free-photo.jpg" alt="lobo">
        <img class="none" src="https://www.shutterstock.com/image-vector/elephant-coloring-pages-kids-trace-260nw-2500388821.jpg">
    </div>

    <div class="image-container">
        <h4>object-position: 110px 40px</h4>
        <img class="wolfposition40" src="https://plus.unsplash.com/premium_photo-1673728218157-b316914d636c?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8d29sZiUyMGV5ZXN8ZW58MHx8MHx8fDA%3D" alt="lobo">
        <img class="wolfposition40" src="https://image.spreadshirtmedia.net/image-server/v1/products/T1459A839PA4459PT28D318360374W10000H9033/views/1,width=378,height=378,appearanceId=839,backgroundColor=F2F2F2/elefante-elefante-bebe-lindo-lindo-comic-de-dibujos-animados.jpg" alt="elephant">
    </div>

    <div class="image-container">
        <h4>object-position: bottom</h4>
        <img class="wolfpositionbottom" src="https://plus.unsplash.com/premium_photo-1673728218157-b316914d636c?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8d29sZiUyMGV5ZXN8ZW58MHx8MHx8fDA%3D" alt="lobo">
        <img class="wolfpositionbottom" src="https://image.spreadshirtmedia.net/image-server/v1/products/T1459A839PA4459PT28D318360374W10000H9033/views/1,width=378,height=378,appearanceId=839,backgroundColor=F2F2F2/elefante-elefante-bebe-lindo-lindo-comic-de-dibujos-animados.jpg" alt="elephant">
    </div>

    <div class="image-container">
        <h4>object-position: center</h4>
        <img class="wolfpositioncenter" src="https://plus.unsplash.com/premium_photo-1673728218157-b316914d636c?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8d29sZiUyMGV5ZXN8ZW58MHx8MHx8fDA%3D" alt="lobo">
        <img class="wolfpositioncenter" src="https://image.spreadshirtmedia.net/image-server/v1/products/T1459A839PA4459PT28D318360374W10000H9033/views/1,width=378,height=378,appearanceId=839,backgroundColor=F2F2F2/elefante-elefante-bebe-lindo-lindo-comic-de-dibujos-animados.jpg" alt="elephant">
    </div>

    <div class="image-container">
        <h4>object-position: top</h4>
        <img class="wolfpositiontop" src="https://plus.unsplash.com/premium_photo-1673728218157-b316914d636c?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8d29sZiUyMGV5ZXN8ZW58MHx8MHx8fDA%3D" alt="lobo">
        <img class="wolfpositiontop" src="https://image.spreadshirtmedia.net/image-server/v1/products/T1459A839PA4459PT28D318360374W10000H9033/views/1,width=378,height=378,appearanceId=839,backgroundColor=F2F2F2/elefante-elefante-bebe-lindo-lindo-comic-de-dibujos-animados.jpg" alt="elephant">
    </div>
</body>
</html>
